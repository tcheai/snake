<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c5d4a4">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Snake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23c5d4a4'/%3E%3Cpath fill='%23242c18' d='M1 1h14v1H1zm0 13h14v1H1zM1 1h1v14H1zm13 0h1v14h-1zM3 7h6v2H3zm5 2h2v3H8zM3 12h8v2H3z'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --paper: #c5d4a4;
    --ink: #242c18;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
  }
  body {
    min-height: 100svh;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 130% 55% at 50% -8%, rgba(255, 255, 255, 0.42), transparent 52%),
      radial-gradient(ellipse 100% 48% at 50% 112%, rgba(36, 44, 24, 0.13), transparent 50%),
      radial-gradient(ellipse 85% 70% at 50% 46%, transparent 52%, rgba(36, 44, 24, 0.055) 100%);
  }
  canvas {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: var(--paper);
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<p id="status" class="sr" aria-live="polite">Tap, swipe, or press arrows to start. Score 0</p>
<canvas id="lcd" width="336" height="560" aria-label="Snake"></canvas>
<script>
(function () {
  const PAPER = "#c5d4a4";
  const INK = "#242c18";
  const LW = 84;
  const LH = 140;
  const CELL = 4;
  const COLS = 20;
  const ROWS = 31;
  const OX = 2;
  const OY = 14;

  const FONT = {
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    E: ["11111","10000","10000","11110","10000","10000","11111"],
    O: ["01110","10001","10001","10001","10001","10001","01110"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
    S: ["01111","10000","10000","01110","00001","00001","11110"],
    T: ["11111","00100","00100","00100","00100","00100","00100"],
    V: ["10001","10001","10001","10001","10001","01010","00100"],
    "0": ["01110","10001","10011","10101","11001","10001","01110"],
    "1": ["00100","01100","00100","00100","00100","00100","01110"],
    "2": ["01110","10001","00001","00010","00100","01000","11111"],
    "3": ["11110","00001","00001","01110","00001","00001","11110"],
    "4": ["10001","10001","10001","11111","00001","00001","00001"],
    "5": ["11111","10000","11110","00001","00001","10001","01110"],
    "6": ["01110","10000","11110","10001","10001","10001","01110"],
    "7": ["11111","00001","00010","00100","01000","01000","01000"],
    "8": ["01110","10001","10001","01110","10001","10001","01110"],
    "9": ["01110","10001","10001","01111","00001","00001","01110"]
  };

  const canvas = document.getElementById("lcd");
  const status = document.getElementById("status");
  const ctx = canvas.getContext("2d", { alpha: false });

  let snake, dir, queue, food, score, mode, tickMs, acc, last, scale;

  function textWidth(str) {
    return str.length * 6 - 1;
  }

  function reset() {
    const y = 15;
    snake = [{ x: 4, y: y }, { x: 5, y: y }, { x: 6, y: y }, { x: 7, y: y }];
    dir = { x: 1, y: 0 };
    queue = [];
    food = { x: 12, y: y };
    score = 0;
    tickMs = 170;
    acc = 0;
    mode = "ready";
    publish();
  }

  function publish() {
    const text = mode === "over"
      ? "Game over. Score " + score + ". Tap or press enter to restart"
      : mode === "ready"
        ? "Tap, swipe, or press arrows to start. Score " + score
        : "Score " + score;
    if (status.textContent !== text) status.textContent = text;
    const head = snake[snake.length - 1];
    status.dataset.mode = mode;
    status.dataset.score = String(score);
    status.dataset.len = String(snake.length);
    status.dataset.hx = String(head.x);
    status.dataset.hy = String(head.y);
  }

  function spawnFood() {
    const taken = new Set(snake.map(function (s) { return s.x + "," + s.y; }));
    const open = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!taken.has(x + "," + y)) open.push({ x: x, y: y });
      }
    }
    if (!open.length) {
      mode = "over";
      return;
    }
    food = open[(Math.random() * open.length) | 0];
  }

  function turn(nx, ny) {
    const base = queue.length ? queue[queue.length - 1] : dir;
    if (nx === base.x && ny === base.y) return;
    if (nx === -base.x && ny === -base.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function begin() {
    if (mode === "over") reset();
    mode = "play";
    acc = 0;
    publish();
  }

  function die() {
    mode = "over";
    queue = [];
    publish();
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = snake[snake.length - 1];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die();
      return;
    }
    const eating = food && nx === food.x && ny === food.y;
    const hit = snake.some(function (s, i) {
      if (!eating && i === 0) return false;
      return s.x === nx && s.y === ny;
    });
    if (hit) {
      die();
      return;
    }
    snake.push({ x: nx, y: ny });
    if (eating) {
      score += 1;
      if (score % 4 === 0) tickMs = Math.max(80, tickMs - 10);
      spawnFood();
    } else {
      snake.shift();
    }
    publish();
  }

  function drawGlyph(ch, x, y) {
    const g = FONT[ch];
    if (!g) return;
    for (let gy = 0; gy < 7; gy++) {
      for (let gx = 0; gx < 5; gx++) {
        if (g[gy][gx] === "1") ctx.fillRect(x + gx, y + gy, 1, 1);
      }
    }
  }

  function drawText(str, x, y) {
    for (let i = 0; i < str.length; i++) {
      drawGlyph(str[i], x, y);
      x += 6;
    }
  }

  function drawEye(x, y) {
    ctx.fillStyle = PAPER;
    if (dir.x === 1) {
      ctx.fillRect(x + 2, y + 1, 1, 1);
      ctx.fillRect(x + 2, y + 2, 1, 1);
    } else if (dir.x === -1) {
      ctx.fillRect(x + 1, y + 1, 1, 1);
      ctx.fillRect(x + 1, y + 2, 1, 1);
    } else if (dir.y === -1) {
      ctx.fillRect(x + 1, y + 1, 1, 1);
      ctx.fillRect(x + 2, y + 1, 1, 1);
    } else {
      ctx.fillRect(x + 1, y + 2, 1, 1);
      ctx.fillRect(x + 2, y + 2, 1, 1);
    }
    ctx.fillStyle = INK;
  }

  function drawFood(x, y) {
    ctx.fillRect(x + 1, y, 2, 1);
    ctx.fillRect(x, y + 1, 4, 2);
    ctx.fillRect(x + 1, y + 3, 2, 1);
  }

  function drawLabel(word) {
    const tw = textWidth(word);
    const x = ((LW - tw) / 2) | 0;
    const y = LH - 18;
    ctx.fillStyle = PAPER;
    ctx.fillRect(x - 2, y - 2, tw + 4, 11);
    ctx.fillStyle = INK;
    drawText(word, x, y);
  }

  function draw() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, LW, LH);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, LW, 1);
    ctx.fillRect(0, LH - 1, LW, 1);
    ctx.fillRect(0, 0, 1, LH);
    ctx.fillRect(LW - 1, 0, 1, LH);
    ctx.fillRect(0, 12, LW, 1);
    drawText(String(score).padStart(4, "0"), 4, 3);
    if (food) drawFood(OX + food.x * CELL, OY + food.y * CELL);
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      const x = OX + s.x * CELL;
      const y = OY + s.y * CELL;
      ctx.fillRect(x, y, CELL, CELL);
      if (i === snake.length - 1) drawEye(x, y);
    }
    if (mode === "ready") drawLabel("START");
    else if (mode === "over") drawLabel("OVER");
  }

  function readInset(name) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(name);
    const n = parseFloat(raw);
    return n > 0 ? n : 0;
  }

  function fit() {
    const sat = readInset("--sat");
    const sar = readInset("--sar");
    const sab = readInset("--sab");
    const sal = readInset("--sal");
    const margin = 12;
    const availW = window.innerWidth - sal - sar - margin * 2;
    const availH = window.innerHeight - sat - sab - margin * 2;
    scale = Math.floor(Math.min(availW / LW, availH / LH));
    if (scale < 2) scale = 2;
    if (scale > 6) scale = 6;
    const cssW = LW * scale;
    const cssH = LH * scale;
    canvas.width = cssW;
    canvas.height = cssH;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    let x = Math.floor((window.innerWidth - cssW) / 2);
    let y = Math.floor((window.innerHeight - cssH) / 2);
    const minX = Math.floor(sal + margin);
    const minY = Math.floor(sat + margin);
    const maxX = Math.floor(window.innerWidth - sar - margin - cssW);
    const maxY = Math.floor(window.innerHeight - sab - margin - cssH);
    if (x < minX) x = minX;
    if (y < minY) y = minY;
    if (x > maxX) x = Math.max(minX, maxX);
    if (y > maxY) y = Math.max(minY, maxY);
    canvas.style.left = x + "px";
    canvas.style.top = y + "px";
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = false;
    draw();
  }

  function frame(t) {
    if (!last) last = t;
    let dt = t - last;
    last = t;
    if (dt > 80) dt = 80;
    if (dt < 0) dt = 0;
    if (mode === "play") {
      acc += dt;
      while (mode === "play" && acc >= tickMs) {
        acc -= tickMs;
        step();
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  const KEYS = {
    ArrowUp: [0, -1],
    ArrowDown: [0, 1],
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0],
    w: [0, -1],
    a: [-1, 0],
    s: [0, 1],
    d: [1, 0],
    W: [0, -1],
    A: [-1, 0],
    S: [0, 1],
    D: [1, 0]
  };

  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      begin();
      return;
    }
    const move = KEYS[e.key];
    if (!move) return;
    e.preventDefault();
    if (mode !== "play") begin();
    turn(move[0], move[1]);
  });

  let pointer = null;
  window.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointer = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  window.addEventListener("pointerup", function (e) {
    if (!pointer || e.pointerId !== pointer.id) return;
    const dx = e.clientX - pointer.x;
    const dy = e.clientY - pointer.y;
    pointer = null;
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    if (ax < 18 && ay < 18) {
      if (mode !== "play") begin();
      return;
    }
    if (mode !== "play") begin();
    if (ax > ay) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });
  window.addEventListener("pointercancel", function () { pointer = null; });
  window.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  document.addEventListener("visibilitychange", function () {
    last = 0;
    acc = 0;
  });

  reset();
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
